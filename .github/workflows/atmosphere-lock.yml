name: Generate atmospheric dashboard dependency lock
on:
  push:
    branches: ['feat/atmospheric-map-20261107']
    paths: ['package.json', '.github/workflows/atmosphere-lock.yml']
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'christianhola/-meridian-showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock direct dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible installation
        run: npm ci --no-audit --no-fund
      - name: Push the validated lockfile to the feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(lock): resolve MapLibre and Recharts dependencies"
            git fetch origin feat/atmospheric-map-20261107
            git rebase origin/feat/atmospheric-map-20261107
            git push origin HEAD:feat/atmospheric-map-20261107
          fi
