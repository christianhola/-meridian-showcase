name: Publish Meridian documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: meridian-docs-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Copy editorial illustrations
        run: |
          mkdir -p docs/public
          cp assets/*.svg docs/public/
      - name: Build documentation
        run: npm run docs:build
      - name: Build interactive agents site for GitHub Pages
        run: npm run build -- --base=/-meridian-showcase/app/
      - name: Include Community app and dedicated Agents website
        run: |
          mkdir -p docs/.vitepress/dist/app docs/.vitepress/dist/agents docs/.vitepress/dist/desktop
          cp -R dist/. docs/.vitepress/dist/app/
          # Standalone HTML reuses hashed Vite assets under /app/assets.
          # JavaScript renders only the agents workspace for the /agents/ path.
          cp dist/index.html docs/.vitepress/dist/agents/index.html
          cp dist/index.html docs/.vitepress/dist/desktop/index.html
          sed -i 's/Meridian Community — Tools for Builders/Meridian Agents — Chat gratuito/g' docs/.vitepress/dist/agents/index.html
          sed -i 's/Meridian Community — Tools for Builders/Meridian Desktop — Daytona/g' docs/.vitepress/dist/desktop/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
