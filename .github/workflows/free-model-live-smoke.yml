name: Verify live free agent chat
on:
  pull_request:
    paths:
      - 'scripts/free-model-live-smoke.mjs'
      - '.github/workflows/free-model-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/free-model-live-smoke.mjs
