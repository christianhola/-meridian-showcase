<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="120" height="120" shape-rendering="crispEdges">
  <style>
    @media (prefers-reduced-motion: reduce) { .breathe { animation: none; } }
    @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
  </style>
  <g class="breathe" style="animation: breathe 3s ease-in-out infinite">
    <!-- Body -->
    <rect x="8" y="6" width="16" height="16" fill="#FF3347" rx="2"/>
    <!-- Face background -->
    <rect x="10" y="8" width="12" height="10" fill="#0B0B0D"/>
    <!-- Eyes -->
    <rect x="12" y="10" width="2" height="2" fill="#FFFFFF"/>
    <rect x="18" y="10" width="2" height="2" fill="#FFFFFF"/>
    <!-- Eye shine -->
    <rect x="12" y="10" width="1" height="1" fill="#FF3347"/>
    <rect x="18" y="10" width="1" height="1" fill="#FF3347"/>
    <!-- Mouth -->
    <rect x="14" y="14" width="4" height="1" fill="#FF3347"/>
    <!-- Antenna -->
    <rect x="15" y="3" width="2" height="3" fill="#FF3347"/>
    <rect x="14" y="2" width="4" height="2" fill="#FF3347" rx="1"/>
    <!-- Legs -->
    <rect x="10" y="22" width="3" height="4" fill="#FF3347"/>
    <rect x="19" y="22" width="3" height="4" fill="#FF3347"/>
    <!-- Feet -->
    <rect x="9" y="26" width="5" height="2" fill="#8E1724" rx="1"/>
    <rect x="18" y="26" width="5" height="2" fill="#8E1724" rx="1"/>
    <!-- Arms -->
    <rect x="4" y="10" width="4" height="2" fill="#FF3347" rx="1"/>
    <rect x="24" y="10" width="4" height="2" fill="#FF3347" rx="1"/>
    <!-- Chest light -->
    <rect x="14" y="18" width="4" height="2" fill="#8E1724" rx="1"/>
    <rect x="15" y="18" width="2" height="2" fill="#FF3347"/>
  </g>
</svg>
